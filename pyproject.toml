[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "sarda"
version = "0.1.0"
description = "SAR data parser and Grafana dashboard assets"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas",
  "python-dateutil",
  "pytz",
]

[project.scripts]
sar-parser = "sarda.cli:main"

[project.optional-dependencies]
dev = [
  "pytest",
  "ruff",
  "pyinstaller",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sarda"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
