[package]
name = "sarda"
version = "0.1.0"
edition = "2021"
description = "Turn sysstat SA files into a Grafana dashboard with a single command"
publish = false

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
ctrlc = { version = "3", features = ["termination"] }
regex = "1"
serde_json = "1"
tiny_http = "0.12"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
